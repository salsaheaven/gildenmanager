<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gildenmanager – Führe deine MMORPG-Gilde</title>
    <meta name="description" content="Pixel-Art-Managementspiel: Führe eine MMORPG-Gilde, heuere Helden an, plane Gruppen und Raids und sammle legendäre Beute. Im Browser, auch auf dem Handy." />
    <meta name="theme-color" content="#1a1228" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Vorschau, wenn der Link geteilt wird (Messenger, soziale Netzwerke) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gildenmanager" />
    <meta property="og:description" content="Führe deine MMORPG-Gilde: Helden, Dungeons, Raids und Beute – in Pixel-Art, im Browser." />
    <meta property="og:url" content="https://salsaheaven.github.io/gildenmanager/" />
    <meta property="og:image" content="https://salsaheaven.github.io/gildenmanager/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- Obere Leiste: Gold, aktueller Tag, Knopf "Tag beenden" -->
    <header id="top-bar"></header>

    <!-- Abschnitte: Heute, Helden, Dungeons, Beute, Gilde (auf dem Handy unten) -->
    <nav id="nav-bar"></nav>

    <!-- Unterreiter des gewählten Abschnitts (z.B. Helden: Übersicht | Taverne) -->
    <nav id="sub-nav"></nav>

    <!-- "Weiter" zum nächsten offenen Punkt (nicht auf dem Tagesplan) -->
    <div id="next-todo"></div>

    <!-- Hier wird der aktuelle Bildschirm angezeigt -->
    <main id="screen"></main>

    <!-- Kleine Benachrichtigungen ("Neuer Bewerber in der Taverne!") -->
    <div id="toasts"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
